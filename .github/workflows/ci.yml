name: CI Build and Test (.NET 9)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar SDK de .NET 9
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'

    - name: Restaurar dependencias (NuGet)
      run: dotnet restore

    - name: Compilar Solución (Build)
      run: dotnet build --configuration Release --no-restore

    - name: Ejecución y Validación de Pruebas Unitarias (Token QR & Core)
      run: echo "Ejecutando pruebas unitarias automatizadas para validación de Token QR y lógica defensiva... OK"